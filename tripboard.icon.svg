<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0f172a"/>

  <!-- Board frame -->
  <rect x="12" y="18" width="76" height="64" rx="6" fill="#1e3a5f"/>

  <!-- Board header bar -->
  <rect x="12" y="18" width="76" height="16" rx="6" fill="#2563eb"/>
  <rect x="12" y="26" width="76" height="8" fill="#2563eb"/>

  <!-- Pin/hook at top -->
  <rect x="46" y="10" width="8" height="12" rx="4" fill="#94a3b8"/>

  <!-- Column 1 cards -->
  <rect x="18" y="42" width="18" height="8" rx="3" fill="#38bdf8"/>
  <rect x="18" y="53" width="18" height="8" rx="3" fill="#38bdf8" opacity="0.6"/>

  <!-- Column 2 cards -->
  <rect x="41" y="42" width="18" height="8" rx="3" fill="#34d399"/>
  <rect x="41" y="53" width="18" height="8" rx="3" fill="#34d399" opacity="0.6"/>
  <rect x="41" y="64" width="18" height="8" rx="3" fill="#34d399" opacity="0.35"/>

  <!-- Column 3 cards -->
  <rect x="64" y="42" width="18" height="8" rx="3" fill="#f59e0b"/>
  <rect x="64" y="53" width="18" height="8" rx="3" fill="#f59e0b" opacity="0.6"/>

  <!-- Column dividers -->
  <line x1="38" y1="36" x2="38" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <line x1="61" y1="36" x2="61" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
</svg>
